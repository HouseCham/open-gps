name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  frontend-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
        with:
          node-version: '22'
          working-directory: frontend

      - name: Run linter
        working-directory: frontend
        run: |
          echo "::group::Linting frontend"
          pnpm lint
          echo "::endgroup::"

  frontend-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
        with:
          node-version: '22'
          working-directory: frontend

      - name: Run tests
        working-directory: frontend
        run: |
          echo "::group::Testing frontend"
          pnpm test
          echo "::endgroup::"

  frontend-build:
    needs: [frontend-lint, frontend-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
        with:
          node-version: '22'
          working-directory: frontend

      - name: Build project
        working-directory: frontend
        run: |
          echo "::group::Build frontend"
          pnpm build
          echo "::endgroup::"

  frontend-docker:
    needs: [frontend-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        run: |
          echo "::group::Docker login"
          docker login -u chamito -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          echo "::endgroup::"

      - name: Build docker image
        working-directory: frontend
        run: |
          echo "::group::Build docker image"
          docker build \
            --build-arg PUBLIC_ENV=${{ vars.FRONTEND_ENV }} \
            --build-arg PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }} \
            --build-arg PUBLIC_APP_ORIGIN=${{ vars.APP_ORIGIN }} \
            -t chamito/open-gps-frontend:dev .
          echo "::endgroup::"

      - name: Push frontend image
        run: |
          echo "::group::Push frontend image"
          docker push chamito/open-gps-frontend:dev
          echo "::endgroup::"

      - name: Build nginx image with current frontend
        run: |
          echo "::group::Build nginx image"
          docker build \
            --build-context frontend=docker-image://chamito/open-gps-frontend:dev \
            --pull --no-cache -t chamito/open-gps-nginx:dev nginx
          echo "::endgroup::"

      - name: Push nginx image
        run: |
          echo "::group::Push nginx image"
          docker push chamito/open-gps-nginx:dev
          echo "::endgroup::"
