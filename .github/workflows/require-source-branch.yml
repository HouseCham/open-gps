name: Require source branch for main

on:
  pull_request:
    branches:
      - main

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs to main must come from the 'dev' branch, not '$HEAD_REF'"
            exit 1
          fi
          echo "Source branch is valid: $HEAD_REF -> main"