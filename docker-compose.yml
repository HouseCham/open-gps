services:
  db:
    image: chamito/open-gps-db:dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: chamito/open-gps-migrate:dev
    restart: "no"
    command:
      - "-database"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: chamito/open-gps-api:dev
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      API_PORT: ${API_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_JWKS_URL: ${JWT_JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-open-gps-api}
      AUTHULA_BASE_URL: ${AUTHULA_BASE_URL}
      AUTHULA_SECRET: ${AUTHULA_SECRET}
      AUTHULA_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      WELCOME_EMAIL_TEMPLATE_EN: ${WELCOME_EMAIL_TEMPLATE_EN}
      WELCOME_EMAIL_TEMPLATE_ES: ${WELCOME_EMAIL_TEMPLATE_ES}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: chamito/open-gps-nginx:dev
    restart: unless-stopped
    expose:
      - "80"
    environment:
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:-api:8080}
    depends_on:
      - api

volumes:
  postgres_data: