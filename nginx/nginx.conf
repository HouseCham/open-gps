# Nginx reverse proxy + static file server.
#
# Single entry point for both the frontend (Astro static build) and the
# backend API (Go + Fiber + Authula). Putting everything behind the same
# origin means the http-only `authula.session_token` cookie set by the
# backend is automatically readable by the frontend (no cross-origin
# dance, no need to share credentials between ports).
#
# NOTE for Dokploy: TLS is terminated upstream by Traefik, so this nginx
# listens on plain HTTP/80 only. Traefik injects X-Forwarded-Proto on
# every request, which we forward to the api so cookies get the right
# Secure flag in prod.
#
# Routes:
#   /             → static Astro build at /var/www/html
#   /api/auth/*   → backend api:8080/api/auth/* (Authula: login, signup, JWKS, OAuth callback)
#   /api/v1/*     → backend api:8080/api/v1/*   (app routes: devices, users, access)
#   /health       → backend api:8080/health

server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript text/xml application/xml application/xml+rss
               image/svg+xml;
    gzip_min_length 256;

    root /var/www/html;
    index index.html;

    # ---- Backend API routes ----
    location ~ ^/api/v1/devices/[^/]+/locations/stream$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        gzip off;
    }

    # Authula: sign-in, sign-up, JWKS, OAuth callback, token refresh.
    location /api/auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass Traefik's original scheme through (https in prod, http in local).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Authula uses redirect-based OAuth (302 to Google). Preserve
        # the original Host so the callback URL stays on the public origin.
        proxy_redirect http://api:8080/ https://$host/;
        # Generous read timeout for OAuth callback flows that round-trip
        # through Google before coming back.
        proxy_read_timeout 60s;
    }

    # App routes (devices, users, access, etc.).
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Health check passthrough.
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Frontend static files ----
    # Astro static build emits a SPA-style index.html fallback. The
    # try_files chain mirrors what the standalone frontend nginx used
    # to do.
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # Long-lived caching for fingerprinted assets.
    location ~* \.(?:css|js|svg|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
    }
}
