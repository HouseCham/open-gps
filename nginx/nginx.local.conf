# Nginx reverse proxy — LOCAL DEV ONLY.
#
# Overlays /etc/nginx/conf.d/default.conf via docker-compose.local.yml so
# nginx terminates TLS with the self-signed cert at /etc/nginx/certs/.
# Production uses nginx/nginx.conf + Traefik and never mounts this file.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript text/xml application/xml application/xml+rss
               image/svg+xml;
    gzip_min_length 256;

    root /var/www/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect http://api:8080/ https://$host/;
        proxy_read_timeout 60s;
    }

    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
    }
}